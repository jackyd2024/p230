name: Build official Dropbear for P230 (root accepts any password)

on:
  workflow_dispatch:

# 创建 GitHub Release 需要 contents: write。
permissions:
  contents: write

jobs:
  build:
    name: Cross-compile Dropbear for Android 7.1+ ARM64 (root any-password login)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DROPBEAR_TAG: DROPBEAR_2026.94
      NDK_VERSION: r30
      ANDROID_API: 21
    steps:
      - name: Install host build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git make python3 unzip binutils

      - name: Download the official Google Android NDK and verify checksum
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" \
            -o android-ndk.zip
          # SHA-1 is the integrity checksum published on Google's official NDK download page.
          echo '5107f898313790e449e87eee2183d9a20602dee9  android-ndk.zip' | sha1sum --check --status
          unzip -q android-ndk.zip
          test -x "$RUNNER_TEMP/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"

      - name: Fetch official Dropbear source tag
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$DROPBEAR_TAG" https://github.com/mkj/dropbear.git dropbear-src
          mkdir -p dist
          git -C dropbear-src rev-parse HEAD | tee dist/UPSTREAM_COMMIT.txt
          printf 'Upstream: https://github.com/mkj/dropbear\nTag: %s\n' "$DROPBEAR_TAG" > dist/SOURCE_INFO.txt

      - name: Apply Android root any-password authentication patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('dropbear-src')

          # Enable password authentication, disable public-key authentication,
          # and keep Android paths. The password field will be read but not checked.
          options = root / 'src/default_options.h'
          s = options.read_text()
          replacements = {
              '#define DROPBEAR_SVR_PASSWORD_AUTH 1': '#define DROPBEAR_SVR_PASSWORD_AUTH 1',
              '#define DROPBEAR_SVR_PUBKEY_AUTH 1': '#define DROPBEAR_SVR_PUBKEY_AUTH 0',
              '#define DEFAULT_PATH "/usr/bin:/bin"': '#define DEFAULT_PATH "/system/bin:/system/xbin:/vendor/bin:/vendor/xbin:/sbin:/bin"',
              '#define DEFAULT_ROOT_PATH "/usr/sbin:/usr/bin:/sbin:/bin"': '#define DEFAULT_ROOT_PATH "/system/sbin:/system/bin:/system/xbin:/vendor/bin:/vendor/xbin:/sbin:/bin"',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new, 1)
          marker = '#define DROPBEAR_SVR_PASSWORD_AUTH 1'
          if s.count(marker) != 1:
              raise SystemExit('Cannot define P230 any-password build flag')
          s = s.replace(marker, marker + '\n#define DROPBEAR_P230_ACCEPT_ANY_PASSWORD 1', 1)
          options.write_text(s)

          # Android NDK may not provide crypt(). Password verification is deliberately
          # bypassed by our root-only function patch below, so do not fail the build.
          sysoptions = root / 'src/sysoptions.h'
          s = sysoptions.read_text()
          needle = '#if DROPBEAR_SVR_PASSWORD_AUTH && !HAVE_CRYPT'
          replacement = ('#ifndef HAVE_CRYPT\n#define HAVE_CRYPT 0\n#endif\n'
                         '#if DROPBEAR_SVR_PASSWORD_AUTH && !HAVE_CRYPT && !DROPBEAR_P230_ACCEPT_ANY_PASSWORD')
          if s.count(needle) != 1:
              raise SystemExit('Could not find the official HAVE_CRYPT guard in src/sysoptions.h')
          s = s.replace(needle, replacement, 1)
          shell_marker = '#define COMPAT_USER_SHELLS "/bin/sh","/bin/csh"'
          shell_replacement = '#define COMPAT_USER_SHELLS "/system/bin/sh","/system/bin/csh","/bin/sh","/bin/csh"'
          if s.count(shell_marker) != 1:
              raise SystemExit('Could not find Android-compatible shell list in src/sysoptions.h')
          s = s.replace(shell_marker, shell_replacement, 1)
          sysoptions.write_text(s)

          # Deliberately accept ANY password for the root username only. This is not
          # real password authentication; it removes the password as a security check.
          auth = root / 'src/svr-authpasswd.c'
          s = auth.read_text()
          start = s.index('void svr_auth_password(int valid_user) {')
          end_marker = '\n}\n#endif'
          end = s.index(end_marker, start) + 2
          replacement = r'''void svr_auth_password(int valid_user) {
              char *password = NULL;
              unsigned int passwordlen = 0;
              unsigned int changepw = buf_getbool(ses.payload);

              password = (char *)buf_getstring(ses.payload, &passwordlen);
              if (password != NULL) {
                  m_burn(password, passwordlen);
                  m_free(password);
              }

              if (changepw || !valid_user || ses.authstate.pw_name == NULL
                      || strcmp(ses.authstate.pw_name, "root") != 0) {
                  send_msg_userauth_failure(0, 1);
                  return;
              }

              dropbear_log(LOG_WARNING,
                      "P230 insecure mode: accepting arbitrary password for root from %s",
                      svr_ses.addrstring);
              send_msg_userauth_success();
          }'''
          auth.write_text(s[:start] + replacement + s[end:])

          # Set Android root's shell and home directory for a usable interactive session.
          common = root / 'src/common-session.c'
          s = common.read_text()
          needle = 'ses.authstate.pw_shell = m_strdup(pw->pw_shell);'
          if s.count(needle) != 1:
              raise SystemExit('Could not find pw_shell assignment in common-session.c')
          replacement = r'''ses.authstate.pw_shell = m_strdup(pw->pw_shell);
          if (strcmp(username, "root") == 0) {
              m_free(ses.authstate.pw_dir);
              ses.authstate.pw_dir = m_strdup("/data/ssh-dropbear");
              if (ses.authstate.pw_shell[0] == '\0' || strcmp(ses.authstate.pw_shell, "/bin/sh") == 0) {
                  m_free(ses.authstate.pw_shell);
                  ses.authstate.pw_shell = m_strdup("/system/bin/sh");
              }
          }'''
          s = s.replace(needle, replacement, 1)
          if s.count('return "/bin/sh";') != 1:
              raise SystemExit('Could not find /bin/sh fallback in common-session.c')
          s = s.replace('return "/bin/sh";', 'return "/system/bin/sh";', 1)
          common.write_text(s)

          # Make the compile-time intention visible to reviewers.
          import os
          info = Path('dist/SOURCE_INFO.txt')
          with info.open('a') as f:
              f.write('\nAndroid target: ARM64 / aarch64-linux-android\n')
              f.write(f'Minimum API level: {os.environ["ANDROID_API"]}\n')
              f.write(f'NDK: Android NDK {os.environ["NDK_VERSION"]} (official Google download, checksum verified)\n')
              f.write('Local modifications are recorded in android-local-patches.diff.\n')
              f.write('WARNING: password input is not verified for root; any password is accepted, equivalent to no password authentication.\n')
          PY
          git -C dropbear-src diff -- src/default_options.h src/sysoptions.h src/svr-authpasswd.c src/common-session.c > dist/android-local-patches.diff

      - name: Cross-compile for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          TOOLCHAIN="$RUNNER_TEMP/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export CFLAGS='-O2 -fPIE'
          export LDFLAGS='-pie'
          cd dropbear-src
          ./configure \
            --host=aarch64-linux-android \
            --disable-zlib \
            --disable-syslog \
            --disable-shadow \
            --disable-pam \
            --disable-loginfunc \
            --disable-lastlog \
            --disable-utmp \
            --disable-utmpx \
            --disable-wtmp \
            --disable-wtmpx \
            --disable-pututline \
            --disable-pututxline
          make -j2 PROGRAMS="dropbear dropbearkey"
          "$STRIP" --strip-unneeded dropbear dropbearkey
          file dropbear dropbearkey
          "$TOOLCHAIN/bin/llvm-readelf" -h dropbear | grep -E 'Class:|Machine:'
          "$TOOLCHAIN/bin/llvm-readelf" -l dropbear | grep -F '/system/bin/linker64'
          install -m 0755 dropbear "$GITHUB_WORKSPACE/dist/dropbear"
          install -m 0755 dropbearkey "$GITHUB_WORKSPACE/dist/dropbearkey"
          if [ -f COPYING ]; then cp COPYING "$GITHUB_WORKSPACE/dist/DROPBEAR-LICENSE.txt"; fi

      - name: Package Android service and Windows installer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cat > dist/dropbear-service.sh <<'ANDROID_SCRIPT'
          #!/system/bin/sh
          # P230 root SSH service. INSECURE: any password is accepted for root.
          # A firewall rule restricts TCP 2222 to the configured Windows PC IP.
          D=/data/ssh-dropbear
          BIN="$D/dropbear"
          KEYGEN="$D/dropbearkey"
          HOSTKEY="$D/host_ed25519"
          PIDFILE="$D/dropbear.pid"
          LOGFILE="$D/dropbear.log"
          PORT=2222
          FWCHAIN=P230_DROPBEAR_GUARD
          SOURCEFILE="$D/allowed_source_ip"

          log() { echo "[dropbear-p230] $*"; }
          is_our_pid() {
              p="$1"
              case "$p" in ''|*[!0-9]*) return 1 ;; esac
              [ -r "/proc/$p/cmdline" ] || return 1
              grep -aq "$BIN" "/proc/$p/cmdline" 2>/dev/null
          }
          firewall_setup() {
              ALLOWED_SOURCE="$(cat "$SOURCEFILE" 2>/dev/null)"
              case "$ALLOWED_SOURCE" in
                  ''|*[!0-9.]*|*.*.*.*.*) log "无效的来源 IP：$ALLOWED_SOURCE"; return 1 ;;
              esac
              if ! command -v iptables >/dev/null 2>&1; then
                  log '拒绝启动：找不到 iptables，无法限制可访问 SSH 的来源 IP。'
                  return 1
              fi
              iptables -L INPUT >/dev/null 2>&1 || { log 'iptables INPUT 链不可用。'; return 1; }
              if iptables -L "$FWCHAIN" >/dev/null 2>&1; then
                  iptables -F "$FWCHAIN" || return 1
              else
                  iptables -N "$FWCHAIN" || return 1
              fi
              iptables -A "$FWCHAIN" -s "$ALLOWED_SOURCE" -j ACCEPT || return 1
              iptables -A "$FWCHAIN" -j DROP || return 1
              if ! iptables -S INPUT 2>/dev/null | grep -F -- "--dport $PORT" | grep -F -- "-j $FWCHAIN" >/dev/null; then
                  iptables -I INPUT 1 -p tcp --dport "$PORT" -j "$FWCHAIN" || return 1
              fi
              log "防火墙已限制 TCP $PORT 仅允许来源 $ALLOWED_SOURCE。"
          }
          firewall_remove() {
              if command -v iptables >/dev/null 2>&1; then
                  while iptables -D INPUT -p tcp --dport "$PORT" -j "$FWCHAIN" 2>/dev/null; do :; done
                  iptables -F "$FWCHAIN" 2>/dev/null
                  iptables -X "$FWCHAIN" 2>/dev/null
              fi
          }
          start_service() {
              id | grep -q 'uid=0(root)' || { log '错误：必须以 root 运行。'; return 1; }
              [ -x "$BIN" ] || { log "找不到 $BIN"; return 1; }
              [ -x "$KEYGEN" ] || { log "找不到 $KEYGEN"; return 1; }
              [ -s "$SOURCEFILE" ] || { log "缺少允许访问的电脑 IP：$SOURCEFILE"; return 1; }
              if [ -f "$PIDFILE" ]; then
                  oldpid="$(cat "$PIDFILE" 2>/dev/null)"
                  if is_our_pid "$oldpid" && kill -0 "$oldpid" 2>/dev/null; then
                      log "Dropbear 已运行，PID=$oldpid，端口=$PORT"; return 0
                  fi
                  rm -f "$PIDFILE"
              fi
              firewall_setup || return 1
              chmod 700 "$D"
              chmod 755 "$BIN" "$KEYGEN"
              chown 0:0 "$D" "$BIN" "$KEYGEN" 2>/dev/null
              if [ ! -s "$HOSTKEY" ]; then
                  log '首次生成 ED25519 主机密钥……'
                  "$KEYGEN" -t ed25519 -f "$HOSTKEY" >>"$LOGFILE" 2>&1 || {
                      log '主机密钥生成失败：'; cat "$LOGFILE" 2>/dev/null; return 1;
                  }
              fi
              chown 0:0 "$HOSTKEY" 2>/dev/null
              chmod 600 "$HOSTKEY"
              : > "$LOGFILE"
              # Do NOT use -s: that flag disables password login. This build accepts any root password.
              if command -v nohup >/dev/null 2>&1; then
                  nohup "$BIN" -F -p "$PORT" -r "$HOSTKEY" -P "$PIDFILE" -T 10 -j -k </dev/null >>"$LOGFILE" 2>&1 &
              else
                  "$BIN" -F -p "$PORT" -r "$HOSTKEY" -P "$PIDFILE" -T 10 -j -k </dev/null >>"$LOGFILE" 2>&1 &
              fi
              pid=$!
              echo "$pid" > "$PIDFILE"
              sleep 1
              if kill -0 "$pid" 2>/dev/null; then
                  log "Dropbear 已启动：TCP $PORT；root 任意密码模式；仅允许来源 IP $(cat "$SOURCEFILE")。"
                  log "警告：密码不会被验证，只有网络来源限制在提供保护。日志：$LOGFILE"
                  return 0
              fi
              log 'Dropbear 启动失败：'; cat "$LOGFILE" 2>/dev/null; rm -f "$PIDFILE"; return 1
          }
          stop_service() {
              if [ -f "$PIDFILE" ]; then
                  pid="$(cat "$PIDFILE" 2>/dev/null)"
                  if is_our_pid "$pid"; then
                      kill "$pid" 2>/dev/null; sleep 1
                      kill -0 "$pid" 2>/dev/null && kill -9 "$pid" 2>/dev/null
                  fi
                  rm -f "$PIDFILE"
              fi
              firewall_remove
              log '服务已停止；来源限制规则已移除。'
          }
          status_service() {
              if [ -f "$PIDFILE" ]; then
                  pid="$(cat "$PIDFILE" 2>/dev/null)"
                  if is_our_pid "$pid" && kill -0 "$pid" 2>/dev/null; then
                      log "运行中：PID=$pid，端口=$PORT，允许来源=$(cat "$SOURCEFILE" 2>/dev/null)"; return 0
                  fi
              fi
              log '未运行。'; return 1
          }
          enable_boot() {
              if [ -d /data/adb/modules ] || [ -d /data/adb/magisk ] || command -v magisk >/dev/null 2>&1; then
                  mkdir -p /data/adb/service.d || { log '无法创建 /data/adb/service.d'; return 1; }
                  cat > /data/adb/service.d/99-dropbear-p230.sh <<'BOOT'
          #!/system/bin/sh
          sleep 10
          /data/ssh-dropbear/dropbear-service.sh start >/data/ssh-dropbear/boot.log 2>&1
          BOOT
                  chmod 755 /data/adb/service.d/99-dropbear-p230.sh
                  log '已创建 Magisk service.d 开机启动脚本。'
              else
                  log '未检测到 Magisk；未修改系统启动配置。重启后使用 ADB 启动服务。'
              fi
          }
          case "${1:-start}" in
              install) mkdir -p "$D" || exit 1; chmod 700 "$D"; start_service ;;
              start) start_service ;;
              stop) stop_service ;;
              status) status_service ;;
              enable-boot) enable_boot ;;
              *) echo "用法：$0 {install|start|stop|status|enable-boot}"; exit 2 ;;
          esac
          ANDROID_SCRIPT

          cat > dist/install-dropbear-p230.ps1 <<'POWERSHELL_SCRIPT'
          #Requires -Version 5.1
          <# 斐讯 P230 Android 7.1.2 ARM64：安装任意密码模式 Dropbear。 #>
          [CmdletBinding()]
          param(
              [string]$Device = '192.168.0.194:5555',
              [string]$TargetIp = '192.168.0.194',
              [string]$AllowedSourceIp = '192.168.32.241',
              [int]$SshPort = 2222
          )
          $ErrorActionPreference = 'Stop'
          function Stop-WithMessage([string]$Message) { Write-Host "错误：$Message" -ForegroundColor Red; exit 1 }
          try {
              $parsedIp = [System.Net.IPAddress]::Parse($AllowedSourceIp)
              if ($parsedIp.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) { Stop-WithMessage 'AllowedSourceIp 必须是 IPv4 地址。' }
              $AllowedSourceIp = $parsedIp.ToString()
          } catch { Stop-WithMessage 'AllowedSourceIp 不是有效的 IPv4 地址。' }
          $script:AdbPath = Join-Path $PSScriptRoot 'adb.exe'
          if (-not (Test-Path -LiteralPath $script:AdbPath)) {
              $adbCommand = Get-Command adb.exe -ErrorAction SilentlyContinue
              if ($adbCommand) { $script:AdbPath = $adbCommand.Source }
              else { Stop-WithMessage '找不到 adb.exe；请与本脚本放在同一目录。' }
          }
          $dropbear = Join-Path $PSScriptRoot 'dropbear'
          $dropbearkey = Join-Path $PSScriptRoot 'dropbearkey'
          $serviceScript = Join-Path $PSScriptRoot 'dropbear-service.sh'
          foreach ($f in @($dropbear, $dropbearkey, $serviceScript)) {
              if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { Stop-WithMessage "缺少文件：$f。请从 Release ZIP 解压全部文件。" }
          }
          Write-Host "[1/7] 连接 ADB：$Device" -ForegroundColor Cyan
          & $script:AdbPath connect $Device | Out-Host
          $devices = & $script:AdbPath devices
          if (-not ($devices -match ([regex]::Escape($Device) + '\s+device\b'))) { Stop-WithMessage 'ADB 状态不是 device，请检查授权和地址。' }
          Write-Host '[2/7] 检查 ADB Root 权限' -ForegroundColor Cyan
          $idOutput = & $script:AdbPath -s $Device shell id 2>&1
          if ($LASTEXITCODE -ne 0 -or ($idOutput -join ' ') -notmatch 'uid=0\(root\)') { Stop-WithMessage "ADB shell 不是 root：$($idOutput -join ' ')" }
          Write-Host ($idOutput -join ' ')
          Write-Host '[3/7] 停止旧服务（如果存在）' -ForegroundColor Cyan
          & $script:AdbPath -s $Device shell 'if [ -f /data/ssh-dropbear/dropbear-service.sh ]; then sh /data/ssh-dropbear/dropbear-service.sh stop; fi' | Out-Host
          Write-Host '[4/7] 上传 Dropbear 程序和服务脚本' -ForegroundColor Cyan
          & $script:AdbPath -s $Device shell 'mkdir -p /data/ssh-dropbear && chmod 700 /data/ssh-dropbear'
          if ($LASTEXITCODE -ne 0) { Stop-WithMessage '无法创建 /data/ssh-dropbear。' }
          & $script:AdbPath -s $Device push $dropbear '/data/ssh-dropbear/dropbear' | Out-Host
          if ($LASTEXITCODE -ne 0) { Stop-WithMessage '上传 dropbear 失败。' }
          & $script:AdbPath -s $Device push $dropbearkey '/data/ssh-dropbear/dropbearkey' | Out-Host
          if ($LASTEXITCODE -ne 0) { Stop-WithMessage '上传 dropbearkey 失败。' }
          & $script:AdbPath -s $Device push $serviceScript '/data/ssh-dropbear/dropbear-service.sh' | Out-Host
          if ($LASTEXITCODE -ne 0) { Stop-WithMessage '上传服务脚本失败。' }
          $sourceFile = Join-Path $env:TEMP ('p230-allowed-source-' + [guid]::NewGuid().ToString('N') + '.txt')
          try {
              [System.IO.File]::WriteAllText($sourceFile, "$AllowedSourceIp`n", [System.Text.Encoding]::ASCII)
              & $script:AdbPath -s $Device push $sourceFile '/data/ssh-dropbear/allowed_source_ip' | Out-Host
              if ($LASTEXITCODE -ne 0) { Stop-WithMessage '上传允许来源 IP 配置失败。' }
          } finally { Remove-Item -LiteralPath $sourceFile -Force -ErrorAction SilentlyContinue }
          & $script:AdbPath -s $Device shell 'chown 0:0 /data/ssh-dropbear /data/ssh-dropbear/dropbear /data/ssh-dropbear/dropbearkey /data/ssh-dropbear/dropbear-service.sh /data/ssh-dropbear/allowed_source_ip && chmod 700 /data/ssh-dropbear && chmod 755 /data/ssh-dropbear/dropbear /data/ssh-dropbear/dropbearkey /data/ssh-dropbear/dropbear-service.sh && chmod 600 /data/ssh-dropbear/allowed_source_ip'
          if ($LASTEXITCODE -ne 0) { Stop-WithMessage '设置权限失败。' }
          Write-Host "[5/7] 启动服务，SSH 端口 $SshPort，仅放行电脑 $AllowedSourceIp" -ForegroundColor Cyan
          & $script:AdbPath -s $Device shell sh /data/ssh-dropbear/dropbear-service.sh install
          if ($LASTEXITCODE -ne 0) {
              & $script:AdbPath -s $Device shell cat /data/ssh-dropbear/dropbear.log
              Stop-WithMessage '服务启动失败。检查盒子是否提供 iptables，以及上方输出。'
          }
          Write-Host '[6/7] 配置 Magisk 开机启动（如果可用）' -ForegroundColor Cyan
          & $script:AdbPath -s $Device shell sh /data/ssh-dropbear/dropbear-service.sh enable-boot | Out-Host
          Write-Host '[7/7] 登录方式' -ForegroundColor Cyan
          Write-Host "ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p $SshPort root@$TargetIp" -ForegroundColor Green
          Write-Host '出现 password 提示时，任意输入内容都能通过；服务端不会验证密码。' -ForegroundColor Yellow
          Write-Host '安全：这等于无密码 Root 登录，已通过 iptables 限制来源 IP；不要开放公网端口。'
          POWERSHELL_SCRIPT
          chmod 644 dist/dropbear-service.sh dist/install-dropbear-p230.ps1

      - name: Write build metadata and checksums
        shell: bash
        run: |
          set -euxo pipefail
          cat > dist/README-中文.txt <<'README'
          斐讯 P230 / Android 7.1.2 / ARM64 的 Dropbear 云编译包

          来源：官方 mkj/dropbear 仓库固定标签 DROPBEAR_2026.94；Android ARM64 交叉编译。
          不需要重编电视盒子固件、不需要 Termux、不修改 /system。程序安装在 /data/ssh-dropbear。

          特别警告：本构建故意让 root 的 SSH 密码验证始终成功——输入任意密码都能登录。这实质上等同于没有密码认证，不能当作安全认证方式。
          为降低风险，安装脚本默认只允许来源 IPv4 192.168.32.241 连接 TCP 2222，依赖 Android 的 iptables。若 iptables 不可用，服务会拒绝启动。
          若你的 Windows 电脑 IP 不同，可运行：
            .\install-dropbear-p230.ps1 -AllowedSourceIp "你的电脑IPv4"
          禁止将 SSH 2222 或 ADB 5555 端口映射到公网。

          使用步骤：
          1. 下载 Release 的 Dropbear-P230-Android-ARM64.zip 并解压。
          2. 将文件放到 Windows platform-tools 目录（应有 adb.exe）。
          3. PowerShell 运行：
             Set-ExecutionPolicy -Scope Process Bypass
             .\install-dropbear-p230.ps1
          4. 默认 ADB 设备 192.168.0.194:5555；安装器确认 ADB Shell 是 root。
          5. 默认允许来源地址是 192.168.32.241。如果 Windows IP 不同，传入 -AllowedSourceIp。
          6. 登录：
             ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p 2222 root@192.168.0.194
          出现密码提示时输入任意内容即可。密码不会校验。

          服务管理（通过 Root ADB）：
            adb shell sh /data/ssh-dropbear/dropbear-service.sh status
            adb shell sh /data/ssh-dropbear/dropbear-service.sh stop
            adb shell sh /data/ssh-dropbear/dropbear-service.sh start

          自动启动：只有检测到 Magisk 时会创建 service.d 脚本；其他固件不会擅自修改系统启动配置。
          构建差异见 android-local-patches.diff，来源提交见 UPSTREAM_COMMIT.txt，SHA256SUMS 可用于校验文件。
          README
          {
            printf '%s\n' dropbear dropbearkey dropbear-service.sh install-dropbear-p230.ps1 android-local-patches.diff SOURCE_INFO.txt UPSTREAM_COMMIT.txt DROPBEAR-LICENSE.txt README-中文.txt
          } | while read -r f; do
            if [ -f "dist/$f" ]; then sha256sum "dist/$f"; fi
          done > dist/SHA256SUMS
          cat dist/SOURCE_INFO.txt
          cat dist/SHA256SUMS

      - name: Create downloadable ZIP for GitHub Releases
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          dist = Path("dist")
          bundle = dist / "Dropbear-P230-Android-ARM64.zip"
          files = [
              "dropbear",
              "dropbearkey",
              "dropbear-service.sh",
              "install-dropbear-p230.ps1",
              "README-中文.txt",
              "SOURCE_INFO.txt",
              "UPSTREAM_COMMIT.txt",
              "android-local-patches.diff",
              "SHA256SUMS",
              "DROPBEAR-LICENSE.txt",
          ]
          missing = [name for name in files[:9] if not (dist / name).is_file()]
          if missing:
              raise SystemExit(f"Missing required release files: {missing}")
          with ZipFile(bundle, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for name in files:
                  path = dist / name
                  if path.is_file():
                      archive.write(path, arcname=name)
          PYZIP
          sha256sum dist/Dropbear-P230-Android-ARM64.zip > dist/Dropbear-P230-Android-ARM64.zip.sha256
          cat dist/Dropbear-P230-Android-ARM64.zip.sha256

      - name: Upload ARM64 build artifact (also attached to GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: Dropbear-P230-Android-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          tag="p230-dropbear-anypass-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          title="Dropbear P230 Android ARM64 any-password build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          # gh is preinstalled on GitHub-hosted Ubuntu runners. contents: write is required.
          gh release create "$tag" dist/* \
            --title "$title" \
            --notes-file dist/README-中文.txt \
            --target "$GITHUB_SHA" \
            --latest
          echo "Release published:"
          gh release view "$tag" --json url --jq .url
