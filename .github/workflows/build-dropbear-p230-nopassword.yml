name: Build official Dropbear for Phicomm P230 Android ARM64

on:
  workflow_dispatch:

# 创建 GitHub Release 需要 contents: write。
permissions:
  contents: write

jobs:
  build:
    name: Cross-compile Dropbear for Android 7.1+ ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DROPBEAR_TAG: DROPBEAR_2026.94
      NDK_VERSION: r30
      ANDROID_API: 21
    steps:
      - name: Install host build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git make python3 unzip binutils

      - name: Download the official Google Android NDK and verify checksum
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" \
            -o android-ndk.zip
          # SHA-1 is the integrity checksum published on Google's official NDK download page.
          echo '5107f898313790e449e87eee2183d9a20602dee9  android-ndk.zip' | sha1sum --check --status
          unzip -q android-ndk.zip
          test -x "$RUNNER_TEMP/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"

      - name: Fetch official Dropbear source tag
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$DROPBEAR_TAG" https://github.com/mkj/dropbear.git dropbear-src
          mkdir -p dist
          git -C dropbear-src rev-parse HEAD | tee dist/UPSTREAM_COMMIT.txt
          printf 'Upstream: https://github.com/mkj/dropbear\nTag: %s\n' "$DROPBEAR_TAG" > dist/SOURCE_INFO.txt

      - name: Apply small Android-specific build settings
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('dropbear-src')
          options = root / 'src/default_options.h'
          s = options.read_text()
          replacements = {
              '#define DROPBEAR_SVR_PASSWORD_AUTH 1': '#define DROPBEAR_SVR_PASSWORD_AUTH 1',
              '#define DEFAULT_PATH "/usr/bin:/bin"': '#define DEFAULT_PATH "/system/bin:/system/xbin:/vendor/bin:/vendor/xbin:/sbin:/bin"',
              '#define DEFAULT_ROOT_PATH "/usr/sbin:/usr/bin:/sbin:/bin"': '#define DEFAULT_ROOT_PATH "/system/sbin:/system/bin:/system/xbin:/vendor/bin:/vendor/xbin:/sbin:/bin"',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new)
          # Android P230 uses a separate Dropbear password hash file; it has no normal Linux root password database.
          macro = '#define DROPBEAR_SVR_PASSWORD_AUTH 1'
          if s.count(macro) != 1:
              raise SystemExit('Could not find the password-auth macro exactly once')
          s = s.replace(macro, macro + '\n#define DROPBEAR_ANDROID_PASSWORD_FILE 1')
          pubkey_macro = '#define DROPBEAR_SVR_PUBKEY_AUTH 1'
          if s.count(pubkey_macro) != 1:
              raise SystemExit('Could not find the public-key-auth macro exactly once')
          s = s.replace(pubkey_macro, '#define DROPBEAR_SVR_PUBKEY_AUTH 0')
          options.write_text(s)

          # The password verifier below uses Dropbear's bundled SHA-256 implementation and PBKDF2,
          # rather than Android's absent /etc/shadow and crypt() password database.
          sysoptions = root / 'src/sysoptions.h'
          s = sysoptions.read_text()
          old = '#if DROPBEAR_SVR_PASSWORD_AUTH && !HAVE_CRYPT'
          new = '#if DROPBEAR_SVR_PASSWORD_AUTH && !HAVE_CRYPT && !DROPBEAR_ANDROID_PASSWORD_FILE'
          if s.count(old) != 1:
              raise SystemExit('Could not locate crypt() build guard in sysoptions.h')
          sysoptions.write_text(s.replace(old, new))

          # Android-specific PBKDF2-SHA256 password verifier. The installer writes only a salted hash
          # to /data/ssh-dropbear/root_password_hash, owned by root and mode 0600.
          auth = root / 'src/svr-authpasswd.c'
          s = auth.read_text()
          start = s.index('#if DROPBEAR_SVR_PASSWORD_AUTH')
          replacement = r'''#if DROPBEAR_SVR_PASSWORD_AUTH

          #define P230_PASSWORD_HASH_FILE "/data/ssh-dropbear/root_password_hash"
          #define P230_PBKDF2_ITERATIONS 200000
          #define P230_SALT_BYTES 16
          #define P230_HASH_BYTES 32

          static int p230_hex_value(char c) {
              if (c >= '0' && c <= '9') return c - '0';
              if (c >= 'a' && c <= 'f') return c - 'a' + 10;
              if (c >= 'A' && c <= 'F') return c - 'A' + 10;
              return -1;
          }

          static int p230_decode_hex(const char *src, unsigned char *dst, size_t bytes) {
              size_t i;
              for (i = 0; i < bytes; i++) {
                  int hi = p230_hex_value(src[i * 2]);
                  int lo = p230_hex_value(src[i * 2 + 1]);
                  if (hi < 0 || lo < 0) return -1;
                  dst[i] = (unsigned char)((hi << 4) | lo);
              }
              return 0;
          }

          static int p230_constant_time_equal(const unsigned char *a, size_t alen,
                  const unsigned char *b, size_t blen) {
              size_t i, n = alen > blen ? alen : blen;
              unsigned int diff = (unsigned int)(alen ^ blen);
              for (i = 0; i < n; i++) {
                  unsigned char av = i < alen ? a[i] : 0;
                  unsigned char bv = i < blen ? b[i] : 0;
                  diff |= (unsigned int)(av ^ bv);
              }
              return diff == 0;
          }

          static int p230_hmac_sha256(const unsigned char *key, size_t keylen,
                  const unsigned char *data, size_t datalen, unsigned char out[32]) {
              unsigned char k[64], inner[32], pad[64];
              size_t i;
              sha256_state md;
              memset(k, 0, sizeof(k));
              if (keylen > sizeof(k)) {
                  if (sha256_init(&md) != CRYPT_OK ||
                      sha256_process(&md, key, (unsigned long)keylen) != CRYPT_OK ||
                      sha256_done(&md, k) != CRYPT_OK) return -1;
              } else if (keylen != 0) {
                  memcpy(k, key, keylen);
              }
              for (i = 0; i < sizeof(k); i++) pad[i] = (unsigned char)(k[i] ^ 0x36);
              if (sha256_init(&md) != CRYPT_OK ||
                  sha256_process(&md, pad, sizeof(pad)) != CRYPT_OK ||
                  sha256_process(&md, data, (unsigned long)datalen) != CRYPT_OK ||
                  sha256_done(&md, inner) != CRYPT_OK) {
                  m_burn(k, sizeof(k)); m_burn(inner, sizeof(inner)); m_burn(pad, sizeof(pad));
                  return -1;
              }
              for (i = 0; i < sizeof(k); i++) pad[i] = (unsigned char)(k[i] ^ 0x5c);
              if (sha256_init(&md) != CRYPT_OK ||
                  sha256_process(&md, pad, sizeof(pad)) != CRYPT_OK ||
                  sha256_process(&md, inner, sizeof(inner)) != CRYPT_OK ||
                  sha256_done(&md, out) != CRYPT_OK) {
                  m_burn(k, sizeof(k)); m_burn(inner, sizeof(inner)); m_burn(pad, sizeof(pad));
                  return -1;
              }
              m_burn(k, sizeof(k)); m_burn(inner, sizeof(inner)); m_burn(pad, sizeof(pad));
              return 0;
          }

          static int p230_pbkdf2_sha256(const unsigned char *password, size_t passwordlen,
                  const unsigned char salt[P230_SALT_BYTES], unsigned char out[P230_HASH_BYTES]) {
              unsigned char block[P230_SALT_BYTES + 4], u[32], t[32];
              unsigned int i;
              size_t j;
              memcpy(block, salt, P230_SALT_BYTES);
              block[P230_SALT_BYTES] = 0;
              block[P230_SALT_BYTES + 1] = 0;
              block[P230_SALT_BYTES + 2] = 0;
              block[P230_SALT_BYTES + 3] = 1;
              if (p230_hmac_sha256(password, passwordlen, block, sizeof(block), u) != 0) return -1;
              memcpy(t, u, sizeof(t));
              for (i = 1; i < P230_PBKDF2_ITERATIONS; i++) {
                  if (p230_hmac_sha256(password, passwordlen, u, sizeof(u), u) != 0) {
                      m_burn(block, sizeof(block)); m_burn(u, sizeof(u)); m_burn(t, sizeof(t));
                      return -1;
                  }
                  for (j = 0; j < sizeof(t); j++) t[j] ^= u[j];
              }
              memcpy(out, t, sizeof(t));
              m_burn(block, sizeof(block)); m_burn(u, sizeof(u)); m_burn(t, sizeof(t));
              return 0;
          }

          static int p230_read_password_hash(unsigned char salt[P230_SALT_BYTES],
                  unsigned char hash[P230_HASH_BYTES]) {
              int fd, ok = -1;
              struct stat st;
              char data[192];
              ssize_t n;
              const char prefix[] = "P230PBKDF2SHA256$200000$";
              const size_t expected_len = sizeof(prefix) - 1 + P230_SALT_BYTES * 2 + 1 + P230_HASH_BYTES * 2;
              fd = open(P230_PASSWORD_HASH_FILE, O_RDONLY | O_NOFOLLOW);
              if (fd < 0) return -1;
              if (fstat(fd, &st) != 0 || !S_ISREG(st.st_mode) || st.st_uid != 0 ||
                  (st.st_mode & 077) != 0 || st.st_size != (off_t)expected_len) goto done;
              n = read(fd, data, sizeof(data));
              if (n != (ssize_t)expected_len) goto done;
              if (strncmp(data, prefix, sizeof(prefix) - 1) != 0) goto done;
              if (data[sizeof(prefix) - 1 + P230_SALT_BYTES * 2] != '$') goto done;
              if (p230_decode_hex(data + sizeof(prefix) - 1, salt, P230_SALT_BYTES) != 0) goto done;
              if (p230_decode_hex(data + sizeof(prefix) - 1 + P230_SALT_BYTES * 2 + 1,
                      hash, P230_HASH_BYTES) != 0) goto done;
              ok = 0;
          done:
              close(fd);
              m_burn(data, sizeof(data));
              return ok;
          }

          void svr_auth_password(int valid_user) {
              char *password = NULL;
              unsigned int passwordlen = 0;
              unsigned int changepw;
              unsigned char salt[P230_SALT_BYTES], stored[P230_HASH_BYTES], derived[P230_HASH_BYTES];
              int success = 0;

              changepw = buf_getbool(ses.payload);
              if (changepw) {
                  send_msg_userauth_failure(0, 1);
                  return;
              }
              password = (char *)buf_getstring(ses.payload, &passwordlen);
              if (valid_user && ses.authstate.pw_name != NULL &&
                  strcmp(ses.authstate.pw_name, "root") == 0 &&
                  passwordlen >= 8 && passwordlen <= DROPBEAR_MAX_PASSWORD_LEN &&
                  memchr(password, 0, passwordlen) == NULL &&
                  p230_read_password_hash(salt, stored) == 0 &&
                  p230_pbkdf2_sha256((const unsigned char *)password, passwordlen, salt, derived) == 0 &&
                  p230_constant_time_equal(derived, sizeof(derived), stored, sizeof(stored))) {
                  success = 1;
              }
              if (password != NULL) {
                  m_burn(password, passwordlen);
                  m_free(password);
              }
              m_burn(salt, sizeof(salt));
              m_burn(stored, sizeof(stored));
              m_burn(derived, sizeof(derived));
              if (success) {
                  dropbear_log(LOG_NOTICE, "Password authentication succeeded for root from %s", svr_ses.addrstring);
                  send_msg_userauth_success();
              } else {
                  dropbear_log(LOG_WARNING, "Password authentication failed for root from %s", svr_ses.addrstring);
                  send_msg_userauth_failure(0, 1);
              }
          }
          #endif
          '''
          auth.write_text(s[:start] + replacement)

          # Android's /data mount may be group-writable. Keep the root user's home

          # inside the root-owned service directory so upstream key permission checks
          # stop there instead of walking into Android's /data mount.
          common = root / 'src/common-session.c'
          s = common.read_text()
          needle = 'ses.authstate.pw_shell = m_strdup(pw->pw_shell);'
          if s.count(needle) != 1:
              raise SystemExit('Could not find the expected pw_shell assignment in common-session.c')
          replacement = r'''ses.authstate.pw_shell = m_strdup(pw->pw_shell);
          if (strcmp(username, "root") == 0) {
              /* Android root shell: use the persistent app-independent data directory. */
              m_free(ses.authstate.pw_dir);
              ses.authstate.pw_dir = m_strdup("/data/ssh-dropbear");
              if (ses.authstate.pw_shell[0] == '\0' || strcmp(ses.authstate.pw_shell, "/bin/sh") == 0) {
                  m_free(ses.authstate.pw_shell);
                  ses.authstate.pw_shell = m_strdup("/system/bin/sh");
              }
          }'''
          common.write_text(s.replace(needle, replacement))

          # Also make the default empty-shell fallback Android-specific.
          s = common.read_text()
          if s.count('return "/bin/sh";') != 1:
              raise SystemExit('Could not find the expected /bin/sh fallback in common-session.c')
          common.write_text(s.replace('return "/bin/sh";', 'return "/system/bin/sh";'))

          # Android uses /system/bin/sh, but getusershell() fallback may advertise /bin/sh.
          svrauth = root / 'src/svr-auth.c'
          s = svrauth.read_text()
          old = 'if (strcmp(listshell, usershell) == 0) {'
          new = 'if (strcmp(listshell, usershell) == 0 || (strcmp(usershell, "/system/bin/sh") == 0 && strcmp(listshell, "/bin/sh") == 0)) {'
          if s.count(old) != 1:
              raise SystemExit('Could not find the shell validation in svr-auth.c')
          svrauth.write_text(s.replace(old, new))

          PY
          git -C dropbear-src diff -- src/default_options.h src/common-session.c src/sysoptions.h src/svr-authpasswd.c src/svr-auth.c > dist/android-local-patches.diff
          cat >> dist/SOURCE_INFO.txt <<EOF2
          Android target: ARM64 / aarch64-linux-android
          Minimum API level: ${ANDROID_API}
          NDK: Android NDK ${NDK_VERSION} (downloaded from dl.google.com; official checksum verified)
          Local changes: see android-local-patches.diff
          - Enable root password login with a local PBKDF2-HMAC-SHA256 verifier (200000 iterations); public-key authentication is disabled.
          - The verifier is stored at /data/ssh-dropbear/root_password_hash, owned by root and mode 0600. It is not Android's system root password.
          - Add Android system directories to the interactive shell PATH and set Android root home/shell paths.
          EOF2

      - name: Cross-compile for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          TOOLCHAIN="$RUNNER_TEMP/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export CFLAGS='-O2 -fPIE'
          export LDFLAGS='-pie'
          cd dropbear-src
          ./configure \
            --host=aarch64-linux-android \
            --disable-zlib \
            --disable-syslog \
            --disable-shadow \
            --disable-pam \
            --disable-loginfunc \
            --disable-lastlog \
            --disable-utmp \
            --disable-utmpx \
            --disable-wtmp \
            --disable-wtmpx \
            --disable-pututline \
            --disable-pututxline
          make -j2 PROGRAMS="dropbear dropbearkey"
          "$STRIP" --strip-unneeded dropbear dropbearkey
          file dropbear dropbearkey
          "$TOOLCHAIN/bin/llvm-readelf" -h dropbear | grep -E 'Class:|Machine:'
          "$TOOLCHAIN/bin/llvm-readelf" -l dropbear | grep -F '/system/bin/linker64'
          install -m 0755 dropbear "$GITHUB_WORKSPACE/dist/dropbear"
          install -m 0755 dropbearkey "$GITHUB_WORKSPACE/dist/dropbearkey"
          if [ -f COPYING ]; then cp COPYING "$GITHUB_WORKSPACE/dist/DROPBEAR-LICENSE.txt"; fi

      - name: Package Android service and Windows installer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cat > dist/dropbear-service.sh <<'ANDROID_SCRIPT'
          #!/system/bin/sh
          # Dropbear 服务控制脚本：仅 root 密码认证，监听 TCP 2222。
          D=/data/ssh-dropbear
          BIN="$D/dropbear"
          KEYGEN="$D/dropbearkey"
          HOSTKEY="$D/host_ed25519"
          HASHFILE="$D/root_password_hash"
          PIDFILE="$D/dropbear.pid"
          LOGFILE="$D/dropbear.log"
          PORT=2222
          
          log() { echo "[dropbear-p230] $*"; }
          is_our_pid() {
              p="$1"
              case "$p" in ''|*[!0-9]*) return 1 ;; esac
              [ -r "/proc/$p/cmdline" ] || return 1
              grep -aq "$BIN" "/proc/$p/cmdline" 2>/dev/null
          }
          start_service() {
              if ! id | grep -q 'uid=0(root)'; then log '错误：必须以 root 运行。'; return 1; fi
              [ -x "$BIN" ] || { log "找不到可执行文件：$BIN"; return 1; }
              [ -x "$KEYGEN" ] || { log "找不到密钥工具：$KEYGEN"; return 1; }
              [ -s "$HASHFILE" ] || { log "密码校验文件不存在：$HASHFILE"; return 1; }
              if [ -f "$PIDFILE" ]; then
                  oldpid="$(cat "$PIDFILE" 2>/dev/null)"
                  if is_our_pid "$oldpid" && kill -0 "$oldpid" 2>/dev/null; then
                      log "Dropbear 已运行，PID=$oldpid，端口=$PORT"; return 0
                  fi
                  rm -f "$PIDFILE"
              fi
              chmod 700 "$D"
              chown 0:0 "$D" "$BIN" "$KEYGEN" "$HASHFILE" 2>/dev/null
              chmod 755 "$BIN" "$KEYGEN"
              chmod 600 "$HASHFILE"
              if [ ! -s "$HOSTKEY" ]; then
                  log '首次生成 ED25519 主机密钥……'
                  "$KEYGEN" -t ed25519 -f "$HOSTKEY" >>"$LOGFILE" 2>&1 || {
                      log '主机密钥生成失败，日志如下：'; cat "$LOGFILE" 2>/dev/null; return 1;
                  }
              fi
              chown 0:0 "$HOSTKEY" 2>/dev/null
              chmod 600 "$HOSTKEY"
              : > "$LOGFILE"
              if command -v nohup >/dev/null 2>&1; then
                  nohup "$BIN" -F -p "$PORT" -r "$HOSTKEY" -P "$PIDFILE" -T 3 -j -k </dev/null >>"$LOGFILE" 2>&1 &
              else
                  "$BIN" -F -p "$PORT" -r "$HOSTKEY" -P "$PIDFILE" -T 3 -j -k </dev/null >>"$LOGFILE" 2>&1 &
              fi
              pid=$!
              echo "$pid" > "$PIDFILE"
              sleep 1
              if kill -0 "$pid" 2>/dev/null; then
                  log "Dropbear 已启动：PID=$pid，端口=$PORT，认证=仅 root 密码（PBKDF2-SHA256）"
                  log "日志文件：$LOGFILE"
                  return 0
              fi
              log 'Dropbear 启动失败，输出日志：'; cat "$LOGFILE" 2>/dev/null; rm -f "$PIDFILE"; return 1
          }
          stop_service() {
              if [ ! -f "$PIDFILE" ]; then log '没有 PID 文件，服务可能未启动。'; return 0; fi
              pid="$(cat "$PIDFILE" 2>/dev/null)"
              if is_our_pid "$pid"; then
                  kill "$pid" 2>/dev/null
                  sleep 1
                  if kill -0 "$pid" 2>/dev/null; then kill -9 "$pid" 2>/dev/null; fi
                  log "已停止 PID=$pid"
              else
                  log 'PID 文件不是当前 Dropbear 进程，避免误杀其他程序。'
              fi
              rm -f "$PIDFILE"
          }
          status_service() {
              if [ -f "$PIDFILE" ]; then
                  pid="$(cat "$PIDFILE" 2>/dev/null)"
                  if is_our_pid "$pid" && kill -0 "$pid" 2>/dev/null; then
                      log "运行中：PID=$pid，TCP 端口=$PORT"; return 0
                  fi
              fi
              log '未运行。'; return 1
          }
          enable_boot() {
              if [ -d /data/adb/modules ] || [ -d /data/adb/magisk ] || command -v magisk >/dev/null 2>&1; then
                  mkdir -p /data/adb/service.d || { log '无法创建 /data/adb/service.d'; return 1; }
                  cat > /data/adb/service.d/99-dropbear-p230.sh <<'BOOT'
          #!/system/bin/sh
          sleep 10
          /data/ssh-dropbear/dropbear-service.sh start >/data/ssh-dropbear/boot.log 2>&1
          BOOT
                  chmod 755 /data/adb/service.d/99-dropbear-p230.sh
                  log '已创建 Magisk service.d 开机启动脚本。'
              else
                  log '未检测到 Magisk；未修改系统启动配置。重启后可通过 ADB 启动：'
                  log 'adb shell sh /data/ssh-dropbear/dropbear-service.sh start'
              fi
          }
          case "${1:-start}" in
              install) mkdir -p "$D" || exit 1; chmod 700 "$D"; start_service ;;
              start) start_service ;;
              stop) stop_service ;;
              status) status_service ;;
              enable-boot) enable_boot ;;
              *) echo "用法：$0 {install|start|stop|status|enable-boot}"; exit 2 ;;
          esac
          ANDROID_SCRIPT

          cat > dist/install-dropbear-p230.ps1 <<'POWERSHELL_SCRIPT'
          #Requires -Version 5.1
          <# P230 Android 7.1.2 / ARM64 Dropbear 安装器。无需 ssh-keygen，只需 Root ADB 和 ssh.exe 登录。 #>
          [CmdletBinding()]
          param([string]$Device = '192.168.0.194:5555', [string]$TargetIp = '192.168.0.194', [int]$SshPort = 2222)
          $ErrorActionPreference = 'Stop'
          function Stop-WithMessage([string]$Message) { Write-Host "错误：$Message" -ForegroundColor Red; exit 1 }
          function Convert-SecureStringToPlainText([Security.SecureString]$SecureValue) {
              $ptr = [Runtime.InteropServices.Marshal]::SecureStringToBSTR($SecureValue)
              try { [Runtime.InteropServices.Marshal]::PtrToStringBSTR($ptr) }
              finally { [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($ptr) }
          }
          function ConvertTo-Hex([byte[]]$Bytes) { ([BitConverter]::ToString($Bytes)).Replace('-', '').ToLowerInvariant() }
          $script:AdbPath = Join-Path $PSScriptRoot 'adb.exe'
          if (-not (Test-Path -LiteralPath $script:AdbPath)) {
              $adbCommand = Get-Command adb.exe -ErrorAction SilentlyContinue
              if ($adbCommand) { $script:AdbPath = $adbCommand.Source }
              else { Stop-WithMessage '找不到 adb.exe。请把本脚本放在 platform-tools 目录，或把 adb.exe 加入 PATH。' }
          }
          $dropbear = Join-Path $PSScriptRoot 'dropbear'
          $dropbearkey = Join-Path $PSScriptRoot 'dropbearkey'
          $serviceScript = Join-Path $PSScriptRoot 'dropbear-service.sh'
          foreach ($f in @($dropbear, $dropbearkey, $serviceScript)) {
              if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { Stop-WithMessage "缺少文件：$f。请解压 GitHub Release 的完整 ZIP。" }
          }
          Write-Host "[1/7] 连接 ADB：$Device" -ForegroundColor Cyan
          & $script:AdbPath connect $Device | Out-Host
          if ($LASTEXITCODE -ne 0) { Stop-WithMessage 'ADB connect 失败。' }
          $deviceList = & $script:AdbPath devices
          if (-not ($deviceList -match ([regex]::Escape($Device) + '\s+device\b'))) { Stop-WithMessage 'ADB 设备状态不是 device；如为 unauthorized，请在电视盒子确认授权。' }
          Write-Host '[2/7] 检查 Root 权限' -ForegroundColor Cyan
          $idOutput = & $script:AdbPath -s $Device shell id 2>&1
          if ($LASTEXITCODE -ne 0 -or ($idOutput -join ' ') -notmatch 'uid=0\(root\)') { Stop-WithMessage "ADB shell 不是 root：$($idOutput -join ' ')" }
          Write-Host ($idOutput -join ' ')
          
          Write-Host '[3/7] 设置 Dropbear 的 root SSH 密码' -ForegroundColor Cyan
          Write-Host '密码规则：8-100 位可打印 ASCII 字符；建议至少 12 位。该密码只用于此 Dropbear 服务，不修改安卓系统账户密码。' -ForegroundColor Yellow
          $secure1 = Read-Host '输入新的 SSH root 密码' -AsSecureString
          $secure2 = Read-Host '再次输入确认' -AsSecureString
          $plain1 = Convert-SecureStringToPlainText $secure1
          $plain2 = Convert-SecureStringToPlainText $secure2
          $secure1.Dispose(); $secure2.Dispose()
          if ($plain1 -cne $plain2) { $plain1 = $null; $plain2 = $null; Stop-WithMessage '两次输入的密码不一致。' }
          if ($plain1 -notmatch '^[\x20-\x7E]{8,100}$') { $plain1 = $null; $plain2 = $null; Stop-WithMessage '密码必须是 8-100 位可打印 ASCII 字符，不能包含换行。' }
          
          # PBKDF2-HMAC-SHA256; the TV stores only the salted verifier, not the plaintext password.
          if (-not ('P230Pbkdf2Sha256' -as [type])) {
          Add-Type -TypeDefinition @'
          using System;
          using System.Security.Cryptography;
          public static class P230Pbkdf2Sha256 {
              public static byte[] Derive(byte[] password, byte[] salt, int iterations, int outputLength) {
                  using (var hmac = new HMACSHA256(password)) {
                      int hashLength = 32;
                      int blocks = (outputLength + hashLength - 1) / hashLength;
                      byte[] output = new byte[outputLength];
                      for (int block = 1; block <= blocks; block++) {
                          byte[] first = new byte[salt.Length + 4];
                          Buffer.BlockCopy(salt, 0, first, 0, salt.Length);
                          first[first.Length - 4] = (byte)(block >> 24);
                          first[first.Length - 3] = (byte)(block >> 16);
                          first[first.Length - 2] = (byte)(block >> 8);
                          first[first.Length - 1] = (byte)block;
                          byte[] u = hmac.ComputeHash(first);
                          byte[] t = (byte[])u.Clone();
                          for (int i = 1; i < iterations; i++) {
                              u = hmac.ComputeHash(u);
                              for (int j = 0; j < t.Length; j++) t[j] ^= u[j];
                          }
                          int take = Math.Min(hashLength, outputLength - (block - 1) * hashLength);
                          Buffer.BlockCopy(t, 0, output, (block - 1) * hashLength, take);
                          Array.Clear(first, 0, first.Length); Array.Clear(u, 0, u.Length); Array.Clear(t, 0, t.Length);
                      }
                      return output;
                  }
              }
          }
          '@
          }
          $iterations = 200000
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          $salt = New-Object byte[] 16
          $rng.GetBytes($salt)
          $rng.Dispose()
          $passwordBytes = [Text.Encoding]::ASCII.GetBytes($plain1)
          $derived = [P230Pbkdf2Sha256]::Derive($passwordBytes, $salt, $iterations, 32)
          $verifier = 'P230PBKDF2SHA256$200000$' + (ConvertTo-Hex $salt) + '$' + (ConvertTo-Hex $derived)
          [Array]::Clear($passwordBytes, 0, $passwordBytes.Length)
          [Array]::Clear($derived, 0, $derived.Length)
          $plain1 = $null; $plain2 = $null
          
          $remoteDir = '/data/ssh-dropbear'
          $tempLocal = Join-Path $env:TEMP (('p230-password-hash-' + [guid]::NewGuid().ToString('N')) + '.txt')
          $tempRemote = "$remoteDir/root_password_hash.upload"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($tempLocal, $verifier, $utf8NoBom)
          $verifier = $null
          try {
              Write-Host '[4/7] 上传二进制文件和密码校验值' -ForegroundColor Cyan
              & $script:AdbPath -s $Device shell "mkdir -p $remoteDir && chmod 700 $remoteDir"
              if ($LASTEXITCODE -ne 0) { Stop-WithMessage '无法创建 /data/ssh-dropbear。' }
              # Stop an older Dropbear process if the previous installer is present.
              & $script:AdbPath -s $Device shell "if [ -f $remoteDir/dropbear-service.sh ]; then sh $remoteDir/dropbear-service.sh stop; fi" | Out-Host
              & $script:AdbPath -s $Device push $dropbear "$remoteDir/dropbear" | Out-Host
              if ($LASTEXITCODE -ne 0) { Stop-WithMessage '复制 dropbear 失败。' }
              & $script:AdbPath -s $Device push $dropbearkey "$remoteDir/dropbearkey" | Out-Host
              if ($LASTEXITCODE -ne 0) { Stop-WithMessage '复制 dropbearkey 失败。' }
              & $script:AdbPath -s $Device push $serviceScript "$remoteDir/dropbear-service.sh" | Out-Host
              if ($LASTEXITCODE -ne 0) { Stop-WithMessage '复制服务脚本失败。' }
              & $script:AdbPath -s $Device push $tempLocal $tempRemote | Out-Host
              if ($LASTEXITCODE -ne 0) { Stop-WithMessage '上传密码校验文件失败。' }
              & $script:AdbPath -s $Device shell "chown 0:0 $tempRemote && chmod 600 $tempRemote && mv $tempRemote $remoteDir/root_password_hash && chmod 700 $remoteDir && chmod 755 $remoteDir/dropbear $remoteDir/dropbearkey $remoteDir/dropbear-service.sh" | Out-Host
              if ($LASTEXITCODE -ne 0) { Stop-WithMessage '设置文件权限失败。' }
          } finally {
              Remove-Item -LiteralPath $tempLocal -Force -ErrorAction SilentlyContinue
          }
          
          Write-Host '[5/7] 启动 SSH 密码服务' -ForegroundColor Cyan
          & $script:AdbPath -s $Device shell sh "$remoteDir/dropbear-service.sh" install | Out-Host
          if ($LASTEXITCODE -ne 0) { & $script:AdbPath -s $Device shell cat "$remoteDir/dropbear.log"; Stop-WithMessage 'Dropbear 启动失败；请把上方日志发回排查。' }
          Write-Host '[6/7] 尝试配置开机启动（检测到 Magisk 时）' -ForegroundColor Cyan
          & $script:AdbPath -s $Device shell sh "$remoteDir/dropbear-service.sh" enable-boot | Out-Host
          Write-Host '[7/7] 检查 SSH 端口' -ForegroundColor Cyan
          Start-Sleep -Seconds 2
          $tcpOk = $false
          try { $tcpOk = Test-NetConnection -ComputerName $TargetIp -Port $SshPort -WarningAction SilentlyContinue -InformationLevel Quiet } catch { $tcpOk = $false }
          if ($tcpOk) {
              Write-Host "SSH 端口 $SshPort 已连通。现在只需要输入你刚刚设置的密码：" -ForegroundColor Green
              Write-Host "ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p $SshPort root@$TargetIp" -ForegroundColor Green
          } else {
              Write-Host "暂未检测到 $TargetIp`:$SshPort 可连接；服务日志：" -ForegroundColor Yellow
              & $script:AdbPath -s $Device shell cat "$remoteDir/dropbear.log"
          }
          Write-Host '说明：这是 Dropbear 独立 SSH 密码，不会更改 Android 系统账户密码；服务只接受 root 密码，最多 3 次认证尝试，禁用 TCP 转发。' -ForegroundColor Cyan
          Write-Host '请勿将 2222 或 ADB 5555 端口映射到公网。' -ForegroundColor Yellow
          POWERSHELL_SCRIPT
          chmod 644 dist/dropbear-service.sh dist/install-dropbear-p230.ps1

      - name: Write build metadata and checksums
        shell: bash
        run: |
          set -euxo pipefail
          cat > dist/README-中文.txt <<'README'
          斐讯 P230 / Android 7.1.2 / ARM64 的官方 Dropbear 云编译包

          编译来源：官方 mkj/dropbear 仓库固定标签 DROPBEAR_2026.94。
          不是电视盒子固件，不需要刷机。程序放在 /data/ssh-dropbear。
          本构建只接受 root 的 Dropbear SSH 密码认证，不启用公钥认证。
          安装器会要求输入并确认密码；电视盒子仅保存每个密码独立加盐的 PBKDF2-HMAC-SHA256 校验值（200000 次迭代），路径 /data/ssh-dropbear/root_password_hash，权限 0600。
          此密码只属于 Dropbear 服务，不修改 Android 系统 root 密码。默认 TCP 端口 2222，最多 3 次认证尝试，禁用本地/远程 TCP 转发。

          使用步骤：
          1. 下载 GitHub Actions 的 artifact 并解压。
          2. 将本目录内容放到 Windows platform-tools 目录（该目录应有 adb.exe），或确保 adb.exe 在 PATH 中。
          3. 在 PowerShell 进入该目录并执行：
             Set-ExecutionPolicy -Scope Process Bypass
             .\install-dropbear-p230.ps1
          4. 安装器会提示设置并确认 SSH root 密码；无需 ssh-keygen，也不需要 SSH 私钥。安装器使用 PBKDF2-HMAC-SHA256 生成加盐校验值，只上传校验值，不上传明文密码。
          5. 登录命令由安装器打印。默认：ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p 2222 root@192.168.0.194

          管理命令：
          adb shell sh /data/ssh-dropbear/dropbear-service.sh status
          adb shell sh /data/ssh-dropbear/dropbear-service.sh stop
          adb shell sh /data/ssh-dropbear/dropbear-service.sh start

          开机启动：只有检测到 Magisk 时才会安装 service.d 脚本；其他 Root 固件不会被擅自修改启动分区。
          安全：切勿把 2222 或 ADB 5555 暴露到公网。建议确认 SSH 可用后，关闭不需要的网络 ADB。

          来源与差异：SOURCE_INFO.txt、UPSTREAM_COMMIT.txt、android-local-patches.diff。
          SHA256SUMS 用于校验本目录主要文件。自定义 Android 密码认证补丁见 android-local-patches.diff；请只在可信局域网使用，不要将 SSH 或 ADB 端口映射到公网。
          README
          {
            printf '%s\n' dropbear dropbearkey dropbear-service.sh install-dropbear-p230.ps1 android-local-patches.diff SOURCE_INFO.txt UPSTREAM_COMMIT.txt DROPBEAR-LICENSE.txt README-中文.txt
          } | while read -r f; do
            if [ -f "dist/$f" ]; then sha256sum "dist/$f"; fi
          done > dist/SHA256SUMS
          cat dist/SOURCE_INFO.txt
          cat dist/SHA256SUMS

      - name: Create downloadable ZIP for GitHub Releases
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          dist = Path("dist")
          bundle = dist / "Dropbear-P230-Android-ARM64.zip"
          files = [
              "dropbear",
              "dropbearkey",
              "dropbear-service.sh",
              "install-dropbear-p230.ps1",
              "README-中文.txt",
              "SOURCE_INFO.txt",
              "UPSTREAM_COMMIT.txt",
              "android-local-patches.diff",
              "SHA256SUMS",
              "DROPBEAR-LICENSE.txt",
          ]
          missing = [name for name in files[:9] if not (dist / name).is_file()]
          if missing:
              raise SystemExit(f"Missing required release files: {missing}")
          with ZipFile(bundle, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for name in files:
                  path = dist / name
                  if path.is_file():
                      archive.write(path, arcname=name)
          PYZIP
          sha256sum dist/Dropbear-P230-Android-ARM64.zip > dist/Dropbear-P230-Android-ARM64.zip.sha256
          cat dist/Dropbear-P230-Android-ARM64.zip.sha256

      - name: Upload downloadable ARM64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dropbear-P230-Android-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          tag="p230-dropbear-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          title="Dropbear P230 Android ARM64 build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          # gh is preinstalled on GitHub-hosted Ubuntu runners. contents: write is required.
          gh release create "$tag" dist/* \
            --title "$title" \
            --notes-file dist/README-中文.txt \
            --target "$GITHUB_SHA" \
            --latest
          echo "Release published:"
          gh release view "$tag" --json url --jq .url
